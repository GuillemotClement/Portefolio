services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "4321"
    environment:
      MAILER_URL: ${MAILER_URL}
    depends_on:
      - mailer

  mailer:
    build:
      context: ./mailer
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8085"
    environment:
      BREVO_API_KEY: ${BREVO_API_KEY}
      RECEIVER_EMAIL: ${RECEIVER_EMAIL}
      PORT: ":8085"
