services:
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      GITHUB_KEY: ${GITHUB_KEY}
      MAILER_URL: ${MAILER_URL}
    depends_on:
      - mailer
    command: ["pnpm", "dev", "--host", "0.0.0.0", "--port", "4321"]
    volumes:
      - ./front:/app
      - /app/node_modules

  mailer:
    build:
      context: ./mailer
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8085"
    environment:
      BREVO_API_KEY: ${BREVO_API_KEY}
      RECEIVER_EMAIL: ${RECEIVER_EMAIL}
      PORT: ":8085"
