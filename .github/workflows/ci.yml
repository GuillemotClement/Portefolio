name: Check CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.15.0 # meme version que dans le package.json

      - name: Install dependancies
        run: pnpm install --frozen-lockfile
        working-directory: front

      # check quality code
      - name: Run ESlint
        run: pnpm exec eslint . --ext .ts,.astro
        working-directory: front

      # check formate
      - name: Run Prettier --check
        run: pnpm exec prettier --check .
        working-directory: front

      # build project
      - name: Build frontend
        run: pnpm run build
        working-directory: front
