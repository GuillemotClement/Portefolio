name: Check CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      #   with:
      #     ref: ${{ github.head.ref }}

      # - name: Pretify code
      #   uses: creyD/prettier_action@v4.6
      #   with:
      #     prettier_options: --write **/*.{ts, md}
      #     only_changed: True

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependancies
        run: pnpm ci

      - name: Run ESlint
        run: npx eslint . --ext .ts,.astro

      - name: Run Prettier --check
        run: npx prettier --check

      - name: Build frontend
        run: pnpm run build
